[package]
name    = "terrapin"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Extract DJI Terra aerotriangulation blocks into open, portable formats"
license = "MIT OR Apache-2.0"

[[bin]]
name = "terrapin"
path = "src/main.rs"

[dependencies]
anyhow     = "1.0"
clap       = { version = "=4.4.18", features = ["derive"] }
quick-xml  = "=0.31.0"
rayon      = "=1.8.1"
serde      = { version = "=1.0.196", features = ["derive"] }
serde_json = "=1.0.113"

[profile.release]
opt-level = 3
lto       = true
codegen-units = 1
